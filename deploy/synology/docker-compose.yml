# منصة التحليل المالي - نشر على Synology DSM (Container Manager)
# ضع هذا الملف مع ملف .env في مجلد المشروع على الـ NAS مثل: /volume1/docker/abusamir
services:
  db:
    image: postgres:16
    container_name: abusamir-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: abusamir
      POSTGRES_PASSWORD: ${DB_PASSWORD:?اضبط DB_PASSWORD في ملف .env}
      POSTGRES_DB: abusamir
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abusamir -d abusamir"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: abusamir/accounting-platform:latest
    container_name: abusamir-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgres://abusamir:${DB_PASSWORD}@db:5432/abusamir
      STORAGE_DIR: /app/storage
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    volumes:
      - ./data/storage:/app/storage
    ports:
      - "${APP_PORT:-4000}:4000"
    shm_size: "512m"
