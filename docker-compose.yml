services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: abusamir
      POSTGRES_PASSWORD: ${DB_PASSWORD:-abusamir_dev}
      POSTGRES_DB: abusamir
    volumes: ["dbdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U abusamir"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    env_file: .env
    environment:
      DATABASE_URL: postgres://abusamir:${DB_PASSWORD:-abusamir_dev}@db:5432/abusamir
      STORAGE_DIR: /app/storage
      PORT: 4000
    volumes: ["storage:/app/storage"]
    ports: ["4000:4000"]
volumes: { dbdata: {}, storage: {} }
